<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git & GitHub Participants</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
        }

        #participants {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
        }

        .card a {
            word-break: break-all;
        }
    </style>
</head>

<body>

    <h1>Git & GitHub Participants</h1>

    <div id="participants"></div>

    <script>
        async function loadParticipants() {
            const response = await fetch("files.txt");
            const text = await response.text();

            const files = text
                .split("\n")
                .map(line => line.trim())
                .filter(line => line !== "");

            const container = document.getElementById("participants");

            for (const file of files) {
                try {
                    const response = await fetch(file);
                    const markdown = await response.text();

                    const name = markdown.match(/name:\s*"([^"]+)"/i)?.[1] || "Unknown";
                    const username = markdown.match(/github username:\s*([^\s]+)/i)?.[1] || "";
                    const date = markdown.match(/date:\s*([^\s]+)/i)?.[1] || "";

                    const githubUrl = `https://github.com/${username}`;

                    const card = document.createElement("div");
                    card.className = "card";

                    card.innerHTML = `
                        <h2>${name}</h2>
                        <p><strong>GitHub:</strong>
                            <a href="${githubUrl}" target="_blank">
                                @${username}
                            </a>
                        </p>
                        <p><strong>Date:</strong> ${date}</p>
                    `;

                    container.appendChild(card);

                } catch (error) {
                    console.error(`Could not load ${file}:`, error);
                }
            }
        }

        loadParticipants();
    </script>

</body>
</html>
